import java.util.Properties

apply plugin: 'com.android.application'

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')

if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

def releaseSigningValue = { String propertyName, String environmentName ->
    releaseSigningProperties.getProperty(propertyName)?.trim() ?: System.getenv(environmentName)?.trim()
}

def releaseStoreFilePath = releaseSigningValue('RELEASE_STORE_FILE', 'WEIMO_RELEASE_STORE_FILE')
def releaseStorePassword = releaseSigningValue('RELEASE_STORE_PASSWORD', 'WEIMO_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('RELEASE_KEY_ALIAS', 'WEIMO_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('RELEASE_KEY_PASSWORD', 'WEIMO_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it }

def releasePackagingRequested = gradle.startParameter.taskNames.any { rawTaskName ->
    def taskName = rawTaskName.tokenize(':').last().toLowerCase(Locale.ROOT)
    def releasePackagingPrefixes = ['assemble', 'bundle', 'package', 'install', 'publish']
    taskName in ['assemble', 'build', 'bundle'] ||
        (taskName.contains('release') && releasePackagingPrefixes.any { taskName.startsWith(it) })
}

android {
    namespace = "com.shuatiwang.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shuatiwang.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Gradle's Windows test worker may fail to load classes when the project path contains
// non-ASCII characters. Stage only the local JVM test classes in the ASCII temp path;
// production sources and APK outputs remain in the project as usual.
def stagedDebugUnitTestClasses = new File(
    System.getProperty('java.io.tmpdir'),
    'weimo-gradle-tests/app/debug'
)
def stageDebugUnitTestClasses = tasks.register('stageDebugUnitTestClasses', Sync) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    from layout.buildDirectory.dir('intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes')
    into stagedDebugUnitTestClasses
}

tasks.withType(Test).configureEach { testTask ->
    if (testTask.name == 'testDebugUnitTest') {
        dependsOn stageDebugUnitTestClasses
        testClassesDirs = files(stagedDebugUnitTestClasses)
        doFirst {
            classpath = files(stagedDebugUnitTestClasses) + classpath
        }
    }
}

if (releasePackagingRequested) {
    if (!releaseSigningConfigured) {
        throw new GradleException(
            'Release signing is not configured. Provide RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, ' +
            'RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD in android/keystore.properties, or set the ' +
            'corresponding WEIMO_RELEASE_* environment variables.'
        )
    }
    if (!rootProject.file(releaseStoreFilePath).isFile()) {
        throw new GradleException('The configured release keystore file does not exist.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
